name: ai_opportunity_radar
publish_to: 'none'
description: MVP scaffold for AI Opportunity Radar
version: 4.0.0+13

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.2
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  image_picker: 1.1.2
  uuid: ^4.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon-1024.png
    - assets/icon-1024-noalpha.png
    - assets/brand-icon-display.png
    - assets/brand-icon-transparent.png
    - assets/onboarding/icon-reference.png
    - assets/onboarding/icon-reference-transparent.png
    - assets/onboarding/onboarding-welcome.png
    - assets/onboarding/onboarding-input.png
    - assets/onboarding/onboarding-experiment.png
    - assets/me/
    - assets/journey/
    - assets/weekly/
